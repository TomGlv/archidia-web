[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Netlify ne supporte pas encore Node 26 ; on fige une LTS compatible.
  NODE_VERSION = "22"

# Ancienne adresse de la page Habitats
[[redirects]]
  from = "/maisons-individuelles/*"
  to = "/habitats/"
  status = 301

[[redirects]]
  from = "/maisons-individuelles"
  to = "/habitats/"
  status = 301

# En-têtes de sécurité de base
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache long pour les assets générés (hash dans le nom de fichier)
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
